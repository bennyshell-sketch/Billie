<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111318" />
<title>Billie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%236b4df6%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27sans-serif%27 font-size=%2718%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3EB%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">B</span>
      <div>
        <h1>Billie</h1>
        <p class="tagline">local-first assistant</p>
      </div>
    </div>
    <div class="status" id="status">
      <span class="chip" id="chip-local" title="Local model">local —</span>
      <span class="chip" id="chip-cloud" title="Claude API">cloud —</span>
      <button class="ghost" id="btn-refresh" title="Refresh status">↻</button>
    </div>
  </header>

  <main class="messages" id="messages">
    <div class="empty" id="empty">
      <h2>Ask Billie something.</h2>
      <p>
        Answers are grounded in the notes in your <code>notes/</code> folder and cited by
        filename. Every reply shows which model produced it — your local model or the
        Claude API — and whether it was grounded in a source.
      </p>
    </div>
  </main>

  <footer class="composer">
    <div class="controls">
      <label class="control">
        <span>Route</span>
        <select id="route">
          <option value="auto">Auto</option>
          <option value="local">Local only</option>
          <option value="cloud">Claude only</option>
        </select>
      </label>
      <label class="toggle" title="Never leaves this machine: local model only, no cloud fallback.">
        <input type="checkbox" id="private" />
        <span>Private</span>
      </label>
      <label class="toggle" title="Retrieve from your notes before answering.">
        <input type="checkbox" id="memory" checked />
        <span>Use memory</span>
      </label>
      <button class="ghost" id="btn-reindex" title="Re-index the notes folder">Re-index notes</button>
      <button class="ghost" id="btn-new" title="Start a new conversation">New chat</button>
    </div>
    <form class="input-row" id="form">
      <textarea id="input" rows="1" placeholder="Message Billie…  (Enter to send, Shift+Enter for a new line)" autocomplete="off"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
    <p class="hint" id="hint"></p>
  </footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>
